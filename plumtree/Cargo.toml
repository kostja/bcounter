[package]
name = "plumtree"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
license = "MIT OR Apache-2.0"
description = "A pure Plumtree (epidemic broadcast tree) state machine: no IO, no clock, driven by events, returning actions."
repository = "https://github.com/kostja/bcounter"
readme = "README.md"
keywords = ["plumtree", "gossip", "epidemic", "broadcast"]
categories = ["network-programming", "algorithms"]
authors = ["Konstantin Osipov <kostja.osipov@gmail.com>"]

[dev-dependencies]
proptest = "1"
