[workspace]
members = ["plumtree", "sim", "gossip-sim"]

[package]
name = "bcounter"
version = "0.2.0"
edition = "2021"
rust-version = "1.63"
license = "MIT OR Apache-2.0"
description = "An escrow bounded counter (BCounter) for distributed capacity quotas, with a map for hierarchical quotas and an allocator trait."
repository = "https://github.com/kostja/bcounter"
homepage = "https://github.com/kostja/bcounter"
documentation = "https://docs.rs/bcounter"
readme = "README.md"
keywords = ["crdt", "counter", "quota", "distributed", "bounded"]
categories = ["data-structures", "concurrency"]
authors = ["Konstantin Osipov <kostja.osipov@gmail.com>"]
exclude = ["sim", "plumtree", "gossip-sim"]

[dependencies]

[dev-dependencies]
proptest = "1"
