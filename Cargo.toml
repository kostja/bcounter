[package]
name = "bcounter"
version = "0.1.1"
edition = "2021"
rust-version = "1.63"
license = "MIT OR Apache-2.0"
description = "A bounded counter (BCounter) CRDT for distributed capacity quotas, plus a map of them for hierarchical (path) quotas."
repository = "https://github.com/kostja/bcounter"
